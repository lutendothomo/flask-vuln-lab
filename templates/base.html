<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>NARI Logistics</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav>
    <span class="brand">NARI Logistics</span>
    {% if session.get('username') %}
      <span>{{ session['username'] }} &middot; <a href="{{ url_for('logout') }}">Log out</a></span>
    {% endif %}
  </nav>
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
