<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NARI Logistics</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav>
    <span class="brand"><span class="brand-mark">&gt;_</span>NARI Logistics</span>
    {% if session.get('username') %}
      <span class="session">{{ session['username'] }}<a href="{{ url_for('logout') }}">Log out</a></span>
    {% endif %}
  </nav>
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
