name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"      # Mondays 06:00 UTC: catches newly published CVEs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run security regression tests
        run: python -m pytest test_security.py -v

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependency CVE scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements-dev.txt
      - name: Static analysis (bandit)
        run: |
          pip install bandit
          bandit -r . -x ./test_security.py,./venv -ll

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t flask-vuln-lab:ci .
      - name: Smoke test (container starts, tables created, login page served)
        run: |
          docker run -d --name app -e SECRET_KEY=ci-only-not-a-real-secret -e COOKIE_SECURE=0 -p 8000:8000 flask-vuln-lab:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/login -o /dev/null && exit 0
            sleep 1
          done
          docker logs app
          exit 1
      - name: Container must refuse to start without SECRET_KEY
        run: |
          if docker run --rm flask-vuln-lab:ci; then
            echo "container started without SECRET_KEY"; exit 1
          fi
      - name: Trivy image scan (HIGH and CRITICAL, fixable only)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            flask-vuln-lab:ci
